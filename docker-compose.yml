services:
  mysql:
    image: mysql:8.0
    container_name: todo-db
    environment:
      MYSQL_ROOT_PASSWORD: kali
      MYSQL_DATABASE: k8s_ingress
      MYSQL_USER: kali
      MYSQL_PASSWORD: kali
    ports:
      - "3307:3306"
    volumes:
      - todo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -ukali -pkali -h 127.0.0.1 -e 'SELECT 1' k8s_ingress || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: todo-backend:dev
    container_name: todo-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: mysql://kali:kali@mysql:3306/k8s_ingress
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: todo-frontend:dev
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  todo_mysql_data:

