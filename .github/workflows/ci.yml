name: CI

on:
  push:
    branches:
      - main
      - CICD

  pull_request:
    branches:
      - main
      - CICD

jobs:

  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: yarn install --frozen-lockfile

      - run: yarn build

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: yarn install --frozen-lockfile

      - run: yarn build

  docker-build-backend:
    needs: backend-test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todolist-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todolist-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todolist-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todolist-backend:latest

  docker-build-frontend:
    needs: frontend-build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todolist-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todolist-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todolist-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todolist-frontend:latest
